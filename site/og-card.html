<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LethalPath — social card (1200×630)</title>
<!--
  Social-card source. Render this page at 1200×630 (device scale factor 1,
  page zoom 100%) and save the result as site/og.png — the six pages
  reference it as og:image.

  Sizing contract: html, body and .card are all pinned to exactly
  1200×630 with overflow:hidden, and every block inside .card is absolutely
  positioned within that box, so nothing can push it past 1200×630 and
  nothing can scroll into view.

  Self-contained by construction: inline CSS, system font stacks only,
  no images, no network requests.
-->
<style>
  html,body{width:1200px;height:630px;margin:0;padding:0;overflow:hidden;background:#07080a}
  .card{
    position:relative;width:1200px;height:630px;overflow:hidden;box-sizing:border-box;
    background:#07080a;border:1px solid #242728;color:#F4F4F6;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  /* the same room the product pages live in: two blooms, one grid */
  .card::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(760px 420px at 82% -12%, rgba(255,138,138,.16), transparent 60%),
      radial-gradient(620px 400px at 4% 24%, rgba(87,193,255,.10), transparent 55%),
      radial-gradient(520px 340px at 46% 118%, rgba(89,212,153,.07), transparent 50%);
  }
  .card::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size:72px 72px;
    mask-image:radial-gradient(ellipse at 50% 22%, #000 18%, transparent 72%);
    -webkit-mask-image:radial-gradient(ellipse at 50% 22%, #000 18%, transparent 72%);
  }
  .layer{position:absolute;z-index:1}

  .brand{left:88px;top:60px;display:flex;align-items:center;gap:13px}
  .brand .mark{width:42px;height:42px;flex:0 0 42px}
  .brand .name{font-size:29px;font-weight:600;letter-spacing:-.02em;color:#F4F4F6}

  .headline{left:88px;top:172px;width:1024px;
    font-size:62px;font-weight:600;letter-spacing:-.03em;line-height:1.14;color:#F4F4F6}

  .route{left:88px;top:392px}

  .kicker{left:88px;top:512px;display:flex;align-items:center;gap:12px;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    font-size:18px;letter-spacing:.01em;color:#CDCDCD}
  .kicker .dot{width:8px;height:8px;border-radius:50%;background:#59D499;flex:0 0 8px}

  .repo{left:88px;top:558px;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    font-size:16px;letter-spacing:.01em;color:#A9A9AB}
</style>
</head>
<body>
<div class="card">

  <div class="layer brand">
    <svg class="mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 2.4 4.2 6v5.6c0 4.7 3.4 8.4 7.8 9.4 4.4-1 7.8-4.7 7.8-9.4V6L12 2.4z" stroke="#FF8A8A" stroke-width="1.5"/>
      <path d="M9.1 12.1l2 2 4-4.1" stroke="#59D499" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="name">LethalPath</span>
  </div>

  <div class="layer headline">The leak is a path.<br>Close it with the fewest permissions.</div>

  <svg class="layer route" width="1024" height="96" viewBox="0 0 1024 96" aria-hidden="true">
    <line x1="12" y1="34" x2="1012" y2="34" stroke="#FF8A8A" stroke-width="1.5"
          stroke-dasharray="2 7" opacity=".75"/>
    <circle cx="12" cy="34" r="6" fill="#FFC533"/>
    <circle cx="512" cy="34" r="6" fill="#57C1FF"/>
    <circle cx="1012" cy="34" r="6" fill="#FF8A8A"/>
    <circle cx="812" cy="34" r="8" fill="none" stroke="#FF8A8A" opacity=".35"/>
    <circle cx="812" cy="34" r="4" fill="#FF8A8A"/>
    <text x="0" y="68" fill="#FFC533" font-size="13" letter-spacing="1.4"
          font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">stranger's words</text>
    <text x="512" y="68" fill="#57C1FF" font-size="13" letter-spacing="1.4" text-anchor="middle"
          font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">agent context</text>
    <text x="1024" y="68" fill="#FF8A8A" font-size="13" letter-spacing="1.4" text-anchor="end"
          font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">public sink</text>
  </svg>

  <div class="layer kicker"><span class="dot" aria-hidden="true"></span>Open source · one command · powered by FalkorDB</div>

  <div class="layer repo">github.com/bhanu-dev82/lethalpath</div>

</div>
</body>
</html>
