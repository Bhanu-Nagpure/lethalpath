name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per ref; a new push cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest

    # The suites talk to a live FalkorDB at localhost:6379 — the same image and
    # healthcheck as docker-compose.yml, so CI tests the engine we pin, not a stub.
    services:
      falkordb:
        image: falkordb/falkordb:6.0.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Eval (40 cases per suite, live)
        run: pnpm --filter @lethalpath/eval evaluate

      - name: CLI smoke — scan the default fixture
        run: |
          set -o pipefail
          node packages/cli/dist/index.js scan | tail -n 20
