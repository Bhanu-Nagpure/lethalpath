name: Feature request
description: A capability LethalPath should have.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Two rules shape what can land here: **FalkorDB is the product, not a
        store beside it** (a feature that still works with the graph removed
        is out of scope), and **the runtime path never sees an LLM**. Requests
        that stay inside those lines are much easier to say yes to.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and where does LethalPath stop you?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should happen instead? If it changes a query or the graph model, say how.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to get there — including doing nothing.
    validations:
      required: true
